name: CI

# Testy przy każdym pushu i PR. Wydanie (release.yml) wywołuje ten sam workflow przed budową APK.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testy (Godot headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godota
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ hashFiles('.github/scripts/install_godot.sh') }}

      - name: Instalacja Godota
        run: bash .github/scripts/install_godot.sh

      - name: Weryfikacja projektu
        run: bash .github/scripts/run_checks.sh

      - name: Logi
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logi-ci
          path: build/logs/
          retention-days: 7

  pgtap:
    name: Testy bazy (pgTAP)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Pakiety z oficjalnego repozytorium Ubuntu 24.04 (bez dodatkowych repozytoriów i obrazów).
      - name: Instalacja Postgresa 16 i pgTAP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            postgresql-16 postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl

      - name: Migracje i testy pgTAP
        run: bash .github/scripts/run_pgtap.sh

      - name: Logi
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logi-pgtap
          path: build/logs/
          retention-days: 7
