name: CI

# Testy przy każdym pushu i PR. Wydanie (release.yml) wywołuje ten sam workflow przed budową APK.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testy (Godot headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godota
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ hashFiles('.github/scripts/install_godot.sh') }}

      - name: Instalacja Godota
        run: bash .github/scripts/install_godot.sh

      - name: Weryfikacja projektu
        run: bash .github/scripts/run_checks.sh

      - name: Logi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logi-ci
          path: build/logs/
          retention-days: 7
